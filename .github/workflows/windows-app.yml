name: windows-app
on:
  push:
    paths: ["windows/**", "apple/qh/Fonts/**", "src/serve.rs", ".github/workflows/windows-app.yml"]
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet publish windows/qh.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o publish
      # qh itself, so the app has a real `qh serve` to attach to
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo build --release
      - shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\qh\bin" | Out-Null
          Copy-Item target/release/qh.exe "$env:LOCALAPPDATA\qh\bin\qh.exe"
          New-Item -ItemType Directory -Force C:\demo\src | Out-Null
          Set-Content C:\demo\README.md "# demo"
          New-Item -ItemType Directory -Force "$env:LOCALAPPDATA\qh" | Out-Null
          Set-Content "$env:LOCALAPPDATA\qh\app.json" '{"Projects":["C:\\demo"]}'
      # the app starts, draws its window and keeps running; screenshots go up as an artifact
      - shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            [System.Drawing.Graphics]::FromImage($bmp).CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("shots/$name.png")
          }
          New-Item -ItemType Directory -Force shots | Out-Null
          $exe = Get-Item publish/qh-app.exe
          $env:QH_APP_MAXIMIZE = "1"
          $p = Start-Process $exe.FullName -PassThru
          Start-Sleep 12
          Shot "1-window"
          # pointer to the top-right corner: the caption buttons should fade in
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(([System.Windows.Forms.Screen]::PrimaryScreen.Bounds.Width - 60), 20)
          Start-Sleep 1
          Shot "2-captions-on-hover"
          # no model on CI: the setup screen. Then the composer's / popup.
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(600, 400)
          Start-Sleep 1
          Shot "3-setup"
          # click into the composer, then type
          Add-Type -MemberDefinition '[DllImport("user32.dll")] public static extern void mouse_event(int f, int x, int y, int d, int e);' -Name M -Namespace W
          [System.Windows.Forms.Cursor]::Position = New-Object System.Drawing.Point(600, 637)
          [W.M]::mouse_event(2, 0, 0, 0, 0); [W.M]::mouse_event(4, 0, 0, 0, 0)
          Start-Sleep 1
          [System.Windows.Forms.SendKeys]::SendWait("/")
          Start-Sleep 1
          Shot "4-slash-commands"
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}^3")
          Start-Sleep 1
          Shot "5-code-layout"
          [System.Windows.Forms.SendKeys]::SendWait("^d")
          Start-Sleep 1
          Shot "6-review"
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}^k")
          Start-Sleep 1
          Shot "7-palette"
          [System.Windows.Forms.SendKeys]::SendWait("{ESC}^+t")
          Start-Sleep 2
          Shot "8-team"
          # lean check: what a low-end PC pays to keep it open
          $p.Refresh()
          $mb = [math]::Round($p.WorkingSet64 / 1MB)
          $cpu = [math]::Round($p.TotalProcessorTime.TotalSeconds, 1)
          $size = [math]::Round((Get-ChildItem publish -Recurse | Measure-Object Length -Sum).Sum / 1MB)
          "memory ${mb} MB, cpu ${cpu} s since launch, install ${size} MB" | Tee-Object -FilePath shots/lean.txt
          $crash = Join-Path $env:TEMP qh-app-crash.txt
          if (Test-Path $crash) { Get-Content $crash }
          if ($p.HasExited) { throw "qh-app exited early with $($p.ExitCode)" }
          Stop-Process $p
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: screenshots, path: shots/ }
      - shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath qh-app-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: qh-app-windows-x64
          path: qh-app-windows-x64.zip
