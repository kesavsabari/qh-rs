name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu, asset: qh-linux-x86_64 }
          - { os: macos-latest,   target: aarch64-apple-darwin,     asset: qh-macos-arm64 }
          - { os: macos-latest,   target: x86_64-apple-darwin,      asset: qh-macos-x86_64 }
          - { os: windows-latest, target: x86_64-pc-windows-msvc,   asset: qh-windows-x86_64.exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: tag matches Cargo.toml
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          grep -q "^version = \"${GITHUB_REF_NAME#v}\"" Cargo.toml || { echo "tag $GITHUB_REF_NAME but Cargo.toml says $(grep '^version' Cargo.toml)"; exit 1; }
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo test --release --target ${{ matrix.target }}
        if: matrix.target != 'x86_64-apple-darwin'  # cross-built on an arm runner; the arm job tests the same code
      - run: cargo build --release --target ${{ matrix.target }}
      - name: name the binary
        shell: bash
        run: |
          src=target/${{ matrix.target }}/release/qh
          [ -f "$src.exe" ] && src="$src.exe"
          cp "$src" "${{ matrix.asset }}"
      # an untagged run (workflow_dispatch) is a test build: keep the binary as a run artifact
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}
          retention-days: 7
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: ${{ matrix.asset }}

  # the Windows app beside the binaries (install-app.ps1 fetches it)
  windows-app:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with: { dotnet-version: "8.0.x" }
      - run: dotnet publish windows/qh.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained -o publish
      - shell: pwsh
        run: Compress-Archive -Path publish/* -DestinationPath qh-app-windows-x64.zip
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with: { name: qh-app-windows-x64.zip, path: qh-app-windows-x64.zip, retention-days: 7 }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qh-app-windows-x64.zip

  # the Linux app beside the binaries (install.sh --app fetches it)
  linux-app:
    runs-on: ubuntu-latest
    container: archlinux:latest
    steps:
      - run: pacman -Syu --noconfirm --needed base-devel git rust gtk4 libadwaita
      - uses: actions/checkout@v4
      - run: cd linux && cargo build --release --locked
      - run: linux/packaging/make-tarball.sh linux/target/release/qh-app .
      - uses: actions/upload-artifact@v4
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        with: { name: qh-app-linux-x86_64.tar.gz, path: qh-app-linux-x86_64.tar.gz, retention-days: 7 }
      - uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: qh-app-linux-x86_64.tar.gz
