[package]
license = "MIT"
name = "qh"
version = "0.2.2"
edition = "2021"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm", "unstable-rendered-line-info"] }
ureq = "2"
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-width = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] } # team members' long-term keys
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging", "tls12"] } # in the tree via ureq; TLS on the relay TCP lane
ring = "0.17" # already in the tree via ureq's TLS; used to check ChatGPT ID-token signatures

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

[target.'cfg(windows)'.dependencies]
# already in the tree via rustix; the sandbox users (src/sandbox_windows.rs): ACLs, tokens, WFP, DPAPI, UAC
windows-sys = { version = "0.59", features = ["Win32_Foundation", "Win32_NetworkManagement_NetManagement",
    "Win32_NetworkManagement_WindowsFilteringPlatform", "Win32_Security", "Win32_Security_Authorization",
    "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_Console", "Win32_System_JobObjects",
    "Win32_System_Registry", "Win32_System_Rpc", "Win32_System_StationsAndDesktops", "Win32_System_Threading",
    "Win32_UI_Shell", "Win32_Graphics_Gdi", "Win32_Networking_WinSock"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2" # already in the tree; the Linux sandbox's syscalls (Landlock, seccomp, namespaces)
