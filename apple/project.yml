# The qh app for Apple platforms. Generate the Xcode project with:  brew install xcodegen && xcodegen
# Mac first; the iPhone app joins as a second target sharing the same SwiftUI code.
name: qh
options:
  bundleIdPrefix: io.github.kesavsabari
  deploymentTarget:
    macOS: "13.0"
  createIntermediateGroups: true
packages:
  SwiftTerm:
    url: https://github.com/migueldeicaza/SwiftTerm
    from: 1.2.0
settings:
  base:
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: 5.0
targets:
  qh:
    type: application
    platform: macOS
    sources:
      - path: qh
    dependencies:
      - package: SwiftTerm
    info:
      path: qh/Info.plist
      properties:
        CFBundleDisplayName: qh
        CFBundleName: qh
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: "13.0"
        NSHumanReadableCopyright: MIT licensed
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.kesavsabari.qh
        PRODUCT_NAME: qh
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        # qh runs your tools in your folders: an App Store sandbox would stop it, so this is a direct-download app
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        COMBINE_HIDPI_IMAGES: YES
