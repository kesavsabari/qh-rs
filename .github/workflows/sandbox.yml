name: sandbox
# The safety exit check (PLAN.md, Phase 5): the red-team suite blocked 100% and real work passing
# inside the sandbox, on Linux (with and without unprivileged namespaces), macOS and Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-no-namespaces }  # Ubuntu 24.04 restricts unprivileged user namespaces
          - { os: ubuntu-latest, name: linux-namespaces, userns: true }
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      QH_REQUIRE_SANDBOX: "1"
      QH_REALWORK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pytest
        shell: bash
        run: python3 -m pip install --quiet pytest || python -m pip install --quiet pytest
      - name: allow unprivileged user namespaces
        if: matrix.userns
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: what this runner offers
        if: runner.os == 'Linux'
        run: cat /sys/kernel/security/lsm; echo; uname -r
      # Windows: the sandbox users need admin once (the runner is admin, so no UAC prompt)
      - name: qh sandbox setup
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release && ./target/release/qh.exe sandbox setup && ./target/release/qh.exe __tool --status
      - name: TEMP experiment, Low integrity for online commands
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 1 -subj /CN=localhost 2>/dev/null || echo "openssl failed"
          python -c "import http.server,ssl;s=http.server.HTTPServer(('127.0.0.1',47610),http.server.SimpleHTTPRequestHandler);c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);c.load_cert_chain('c.pem','k.pem');s.socket=c.wrap_socket(s.socket,server_side=True);s.serve_forever()" &
          sleep 3
          mkdir -p /d/xlow /d/xopen
          MSYS_NO_PATHCONV=1 icacls 'D:\xlow' /grant 'qh-sandbox:(OI)(CI)M' >/dev/null
          MSYS_NO_PATHCONV=1 icacls 'D:\xlow' /setintegritylevel '(OI)(CI)low'
          MSYS_NO_PATHCONV=1 icacls 'D:\xopen' /grant '*S-1-5-11:(OI)(CI)M' >/dev/null
          B="$(cygpath -w /usr/bin/bash)"; Q="$(cygpath -w "$PWD/target/release/qh.exe")"
          cd /d/xlow
          for m in plain low; do
            echo "======== $m"
            QH_WINSBX_DIAG=$m "$Q" __winsbx on "$B" -lc 'echo bash-ok; whoami; echo x > /d/xlow/f && echo low-dir-write-ok; echo x > /d/xopen/f && echo OPEN-DIR-WRITE-ALLOWED; curl -sk -o /dev/null -w "https=%{http_code} %{errormsg}\n" https://127.0.0.1:47610/; cmd //c "echo cmd-ok"; powershell -NoProfile -Command "Write-Output ps-ok; (Invoke-WebRequest -UseBasicParsing -SkipCertificateCheck https://127.0.0.1:47610/ -ErrorAction SilentlyContinue).StatusCode" 2>&1 | tail -2; python -c "print(\"py-ok\")"; git init -q g && cd g && echo y > a && git add a && git -c user.name=t -c user.email=t@t commit -qm m && echo git-ok; cargo --version; node -e "console.log(\"node-ok\")"'
            echo "exit=$?"
            rm -f /d/xopen/f
          done
          kill %1 || true
      - run: cargo test --release -- --nocapture
        shell: bash
      - name: qh sandbox remove
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/qh.exe sandbox remove
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-LocalUser -Name 'qh-sbx-*') { throw 'sandbox users left behind' }
          if (Get-LocalGroup -Name 'qh-sandbox' -ErrorAction SilentlyContinue) { throw 'sandbox group left behind' }
          if (Test-Path 'C:\Users\qh-sbx-*') { throw 'sandbox user profiles left behind' }
          $f = netsh wfp show filters file=- | Select-String 'qh sandbox'
          if ($f) { throw "firewall filters left behind: $f" }
          if (Test-Path "$env:USERPROFILE\AppData\Local\qh\sandbox-users.dat") { throw 'stored passwords left behind' }
          foreach ($d in @($env:TEMP, 'C:\', 'D:\', $env:ProgramData, $env:PUBLIC)) {
            $a = icacls $d | Select-String 'qh-sandbox|S-1-5-21-'
            if ($a -match 'qh-sandbox') { throw "ACEs left behind on ${d}: $a" }
          }
          "removed cleanly"
