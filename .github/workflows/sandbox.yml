name: sandbox
# The safety exit check (PLAN.md, Phase 5): the red-team suite blocked 100% and real work passing
# inside the sandbox, on Linux (with and without unprivileged namespaces), macOS and Windows.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, name: linux-no-namespaces }  # Ubuntu 24.04 restricts unprivileged user namespaces
          - { os: ubuntu-latest, name: linux-namespaces, userns: true }
          - { os: macos-latest, name: macos }
          - { os: windows-latest, name: windows }
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    env:
      QH_REQUIRE_SANDBOX: "1"
      QH_REALWORK: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: pytest
        shell: bash
        run: python3 -m pip install --quiet pytest || python -m pip install --quiet pytest
      - name: allow unprivileged user namespaces
        if: matrix.userns
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: what this runner offers
        if: runner.os == 'Linux'
        run: cat /sys/kernel/security/lsm; echo; uname -r
      # Windows: the sandbox users need admin once (the runner is admin, so no UAC prompt)
      - name: qh sandbox setup
        if: runner.os == 'Windows'
        shell: bash
        run: cargo build --release && ./target/release/qh.exe sandbox setup && ./target/release/qh.exe __tool --status
      - name: TEMP diagnosis, TLS inside the sandbox
        if: runner.os == 'Windows'
        shell: bash
        continue-on-error: true
        run: |
          set +e
          MSYS_NO_PATHCONV=1 openssl req -x509 -newkey rsa:2048 -nodes -keyout k.pem -out c.pem -days 1 -subj /CN=localhost || echo "openssl failed"
          python -c "import http.server,ssl;s=http.server.HTTPServer(('127.0.0.1',47610),http.server.SimpleHTTPRequestHandler);c=ssl.SSLContext(ssl.PROTOCOL_TLS_SERVER);c.load_cert_chain('c.pem','k.pem');s.socket=c.wrap_socket(s.socket,server_side=True);s.serve_forever()" &
          sleep 3
          C="$(cygpath -w "$(command -v curl)")"
          echo "host: $(curl -sk -o /dev/null -w '%{http_code}' https://127.0.0.1:47610/)"
          for m in restricted rsid auth lua plain; do echo "== $m"; QH_WINSBX_DIAG=$m ./target/release/qh.exe __winsbx on "$C" -sk -o NUL -w "code=%{http_code} %{errormsg}" https://127.0.0.1:47610/; echo " exit=$?"; done
          QH_WINSBX_DIAG=restricted ./target/release/qh.exe __winsbx on "$C" -skv -o NUL https://127.0.0.1:47610/ 2>&1 | tail -8
          kill %1 || true
      - run: cargo test --release -- --nocapture
        shell: bash
      - name: qh sandbox remove
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          ./target/release/qh.exe sandbox remove
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Get-LocalUser -Name 'qh-sbx-*') { throw 'sandbox users left behind' }
          if (Get-LocalGroup -Name 'qh-sandbox' -ErrorAction SilentlyContinue) { throw 'sandbox group left behind' }
          if (Test-Path 'C:\Users\qh-sbx-*') { throw 'sandbox user profiles left behind' }
          $f = netsh wfp show filters file=- | Select-String 'qh sandbox'
          if ($f) { throw "firewall filters left behind: $f" }
          if (Test-Path "$env:USERPROFILE\AppData\Local\qh\sandbox-users.dat") { throw 'stored passwords left behind' }
          $a = icacls $env:TEMP | Select-String 'qh-sandbox'
          if ($a) { throw "ACEs left behind on TEMP: $a" }
          "removed cleanly"
