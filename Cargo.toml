[package]
name = "qh"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = { version = "0.29", default-features = false, features = ["crossterm"] }
ureq = "2"
serde_json = "1"
toml = { version = "0.8", default-features = false, features = ["parse"] }
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode-perl", "unicode-case"] }
unicode-width = "0.2"
x25519-dalek = { version = "2", features = ["static_secrets"] } # team members' long-term keys
ring = "0.17" # already in the tree via ureq's TLS; used to check ChatGPT ID-token signatures

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
